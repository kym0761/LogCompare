<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogClient</title>
    <base href="/" />
    <script>
        (function() {
            var theme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="LogClient.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <!-- [중요] csproj에 있는 OverrideHtmlAssetPlaceholders를 작동시키기 위해 아래 스크립트 태그의 핑거프린트 형식(플레이스홀더)을 유지해야 합니다. -->
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <script>
        window.chatHelpers = {
            // 1. 붙여넣기 이벤트 감지기
            initPasteHandler: function (elementId, dotNetHelper) {
                const el = document.getElementById(elementId);
                if (!el) return;

                el.addEventListener('paste', async (e) => {
                    const items = e.clipboardData.items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) {
                            const blob = items[i].getAsFile();
                            const reader = new FileReader();

                            reader.onload = (event) => {
                                const base64 = event.target.result.split(',')[1];
                                // JS가 C#의 [JSInvokable] 메서드를 호출!
                                dotNetHelper.invokeMethodAsync('OnImagePasted', base64);
                            };

                            reader.readAsDataURL(blob);
                            e.preventDefault(); // 붙여넣기 시 글자가 깨지는 것 방지
                        }
                    }
                });
            },

            // 2. 자동 스크롤 기능
            syncScroll: function (id1, id2, enabled) {
                const el1 = document.getElementById(id1);
                const el2 = document.getElementById(id2);
                if (!el1 || !el2) return;

                // 비활성화 요청 시 이벤트를 제거하고 종료
                if (!enabled) {
                    el1.onscroll = null;
                    el2.onscroll = null;
                    console.log("스크롤 동기화 비활성화");
                    return;
                }

                let isSyncing = false;

                const sync = (source, target) => {
                    if (!isSyncing) {
                        isSyncing = true;
                        target.scrollTop = source.scrollTop;
                        target.scrollLeft = source.scrollLeft; // 가로 스크롤도 완벽 동기화!
                        // 다음 프레임에서 플래그 해제 (성능 최적화)
                        requestAnimationFrame(() => { isSyncing = false; });
                    }
                };

                el1.onscroll = () => sync(el1, el2);
                el2.onscroll = () => sync(el2, el1);

                console.log("휠 동기화 감시 시작!");
            },

            scrollToTop: function (id1, id2) {
                const el1 = document.getElementById(id1);
                const el2 = document.getElementById(id2);

                [el1, el2].forEach(el => {
                    if (el) {
                        // 데이터 로드 직후에는 'smooth'보다 즉시(auto) 이동하는 것이 더 자연스러울 수 있습니다.
                        el.scrollTo({ top: 0, behavior: 'auto' });
                    }
                });
                console.log(`[ScrollToTop] ${id1}, ${id2} 위치 초기화 완료`);
            },

            syncTo: function (sourceId, targetId) {
                const source = document.getElementById(sourceId);
                const target = document.getElementById(targetId);

                if (source && target) {
                    // 무한 루프 방지를 위해 위치가 다를 때만 업데이트
                    if (target.scrollTop !== source.scrollTop) {
                        target.scrollTop = source.scrollTop;
                    }
                }
            }
        };

        window.themeHelper = {
            getTheme: function () {
                return localStorage.getItem('theme') || 'dark';
            },
            setTheme: function (theme) {
                localStorage.setItem('theme', theme);
                document.documentElement.setAttribute('data-theme', theme);
            }
        };
    </script>

</body>

</html>
